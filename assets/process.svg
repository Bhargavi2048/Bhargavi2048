<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="How I build: problem, research, Figma design, Gemini, build, test, deploy">
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;fill:#DDD6FE;text-anchor:middle}
    .n{fill:#1E1B4B;stroke:#7C3AED;stroke-width:2.5;animation:lit 7s infinite}
    .n1{animation-delay:0s}.n2{animation-delay:1s}.n3{animation-delay:2s}.n4{animation-delay:3s}.n5{animation-delay:4s}.n6{animation-delay:5s}.n7{animation-delay:6s}
    @keyframes lit{0%{fill:#1E1B4B}6%{fill:#22D3EE}16%{fill:#7C3AED}100%{fill:#1E1B4B}}
  </style>
  <line x1="70" y1="45" x2="928" y2="45" stroke="#4C1D95" stroke-width="3"/>
  <circle class="n n1" cx="70" cy="45" r="16"/>
  <circle class="n n2" cx="213" cy="45" r="16"/>
  <circle class="n n3" cx="356" cy="45" r="16"/>
  <circle class="n n4" cx="499" cy="45" r="16"/>
  <circle class="n n5" cx="642" cy="45" r="16"/>
  <circle class="n n6" cx="785" cy="45" r="16"/>
  <circle class="n n7" cx="928" cy="45" r="16"/>
  <text x="70" y="90">Problem</text>
  <text x="213" y="90">Research</text>
  <text x="356" y="90">Figma</text>
  <text x="499" y="90">Gemini</text>
  <text x="642" y="90">Build</text>
  <text x="785" y="90">Test</text>
  <text x="928" y="90">Deploy</text>
  <circle r="6" fill="#F5F3FF">
    <animateMotion dur="7s" repeatCount="indefinite" path="M70 45 H928"/>
  </circle>
</svg>
